<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body class="min-vh-100 d-flex flex-column" style="background-color: black;">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script> 

    <div id="carouselExample" class="carousel slide flex-grow-1 m-5">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="assets/image-1.png" class="d-block mx-auto rounded-5" style="height: 75vh;" alt="first image">
            </div>
            <div class="carousel-item">
                <img src="assets/image-2.png" class="d-block mx-auto rounded-5" style="height: 75vh;" alt="second image">
            </div>
            <div class="carousel-item">
                <img src="assets/image-3.png" class="d-block mx-auto rounded-5" style="height: 75vh;" alt="third image">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
        <h1 class="text-center m-2" style="color: white;">Say hello to Qimono!</h1>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var carouselElement = document.getElementById('carouselExample');
            var carousel = new bootstrap.Carousel(carouselElement, {
                interval: 500,
                ride: 'carousel',
                pause: false,
                wrap: true
            });
        });
    </script>
<h2>Acá editando el archivo desde gibhub en celular,  mientras viajo en cole<h2>
</body>
</html>
